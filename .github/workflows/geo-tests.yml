# Тесты библиотеки Geo (static_libs/geo/tests). В релизной сборке они
# выключены (GEO_BUILD_TESTS=OFF), поэтому гоняются отдельно: на push в
# ветки исправлений, когда тронута геометрия или растр, и вручную. Собирается
# только Geo с тестами -- GUI и плагины не нужны. Тулчейн тот же, что в
# release.yml (MSYS2 UCRT64, GCC 16).

name: Geo tests

on:
  push:
    branches: ["fix/**"]
    paths:
      - "static_libs/geo/**"
      - "plugins/gcode/pocketraster/**"
      - ".github/workflows/geo-tests.yml"
  workflow_dispatch:

jobs:
  geo-tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: "true"

      - name: Setup MSYS2 (UCRT64, GCC 16)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cgal
            mingw-w64-ucrt-x86_64-mimalloc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-tools
            git

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGERBER_NATIVE_MARCH=OFF \
            -DGEO_BUILD_TESTS=ON

      - name: Build tests
        run: |
          cmake --build build -j"$(nproc)" --target \
            geo_test_polyline geo_test_util geo_test_polygon geo_test_inflate \
            geo_test_inflatepasses geo_test_cancel geo_test_normalize \
            geo_test_clipopen geo_test_fill

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/static_libs/geo --output-on-failure

      # stdout в канал на Windows буферизуется целиком, и упавший процесс
      # уносит вывод с собой: упавшие тесты запускаются ещё раз напрямую,
      # с выводом QTest в файл, и печатается код выхода. GEO_TRACE_TOPOLYLINE
      # -- трасса Cgal::toPolyline (кривая за кривой, затем вершины) в тот же
      # отчёт: по ней видно, как контур вышел из точного домена.
      - name: Rerun failed tests verbosely
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
          GEO_TRACE_TOPOLYLINE: "1"
        run: |
          for name in $(sed -n 's/^[0-9]*:geo_//p' build/static_libs/geo/Testing/Temporary/LastTestsFailed.log); do
            exe="$(find bin -name "geo_test_${name}.exe" | head -n1)"
            echo "=== geo_test_${name}: $exe"
            set +e
            "$exe" -o "geo_${name}.txt,txt" -o -,txt
            code=$?
            set -e
            echo "=== exit code: $code ($(printf '0x%08X' "$code"))"
            cat "geo_${name}.txt" || echo "(отчёт QTest не записан)"
          done
          exit 1

      # Полный NTSTATUS (0xC0000005 и т.п.) bash обрезает до байта -- его
      # видно только из нативной оболочки.
      - name: Exit codes of failed tests (native)
        if: failure()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "${{ runner.temp }}\msys64\ucrt64\bin;" + $env:PATH
          $failed = Get-Content build/static_libs/geo/Testing/Temporary/LastTestsFailed.log -ErrorAction SilentlyContinue
          foreach ($line in $failed) {
            $name = ($line -split ':', 2)[1] -replace '^geo_', ''
            $exe = Get-ChildItem -Recurse -Path bin -Filter "geo_test_$name.exe" | Select-Object -First 1
            Write-Host "=== $($exe.FullName)"
            & $exe.FullName -o -,txt
            Write-Host ("=== exit code: 0x{0:X8}" -f $LASTEXITCODE)
          }
